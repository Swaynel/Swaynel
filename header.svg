<svg width="680" height="90" viewBox="0 0 680 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .name {
        font-family: 'Courier New', monospace;
        font-size: 32px;
        font-weight: 700;
        fill: #e6edf3;
        letter-spacing: 2px;
      }
      .handle {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #1D9E75;
        letter-spacing: 1px;
      }
      .cursor {
        fill: #1D9E75;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .name-text {
        animation: typing 1.8s steps(14) 0.3s both;
        font-family: 'Courier New', monospace;
        font-size: 32px;
        font-weight: 700;
        fill: #e6edf3;
        letter-spacing: 2px;
      }
      .handle-text {
        animation: fadein 0.5s ease 2.2s both;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #1D9E75;
      }
      .tagline-text {
        animation: fadein 0.5s ease 2.7s both;
        font-family: 'Courier New', monospace;
        font-size: 11px;
        fill: #7d8590;
      }
      @keyframes fadein {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .clip-name {
        animation: expand 1.8s steps(14) 0.3s both;
      }
      @keyframes expand {
        from { width: 0; }
        to { width: 400px; }
      }
    </style>
    <clipPath id="name-clip">
      <rect class="clip-name" x="20" y="10" height="50" width="0">
        <animate attributeName="width" from="0" to="400" dur="1.8s" begin="0.3s" calcMode="discrete" keyTimes="0;0.071;0.142;0.214;0.285;0.357;0.428;0.5;0.571;0.642;0.714;0.785;0.857;0.928;1" keySplines="" values="0;22;44;66;88;110;132;154;176;198;220;242;264;286;400" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="680" height="90" rx="8" class="bg"/>

  <!-- Prompt symbol -->
  <text x="20" y="46" font-family="'Courier New', monospace" font-size="18" fill="#1D9E75">$</text>

  <!-- Name with clip animation -->
  <g clip-path="url(#name-clip)">
    <text x="42" y="46" class="name-text">Isaiah Nyariki</text>
  </g>

  <!-- Blinking cursor -->
  <rect x="42" y="20" width="3" height="30" class="cursor">
    <animate attributeName="x" from="42" to="408" dur="1.8s" begin="0.3s" calcMode="discrete" keyTimes="0;0.071;0.142;0.214;0.285;0.357;0.428;0.5;0.571;0.642;0.714;0.785;0.857;0.928;1" values="42;64;86;108;130;152;174;196;218;240;262;284;306;328;408" fill="freeze"/>
  </rect>

  <!-- Handle -->
  <text x="42" y="66" class="handle-text">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.2s" fill="freeze"/>
    git_saint
  </text>

  <!-- Tagline -->
  <text x="42" y="82" class="tagline-text">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.7s" fill="freeze"/>
    "Hope is the most dangerous asset of a broke man — and also the most powerful."
  </text>
</svg>
